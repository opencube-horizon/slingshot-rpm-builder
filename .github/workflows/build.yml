name: Build and Push SHS Containers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shs_ver:
        description: 'SHS version to build'
        default: '14.0.1'
        type: choice
        options:
          - '14.0.0'
          - '13.1.0'
          - '13.0.0'
          - '12.0.1'

env:
  REGISTRY: ghcr.io
  SHS_VER: ${{ inputs.shs_ver || '14.0.1' }}

permissions:
  contents: read
  packages: write

jobs:
  build-suse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RPMs image (openSUSE)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: rpms
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/slingshot-rpms:${{ env.SHS_VER }}-suse
          build-args: SHS_VER=${{ env.SHS_VER }}
          cache-from: type=gha,scope=suse-shs-${{ env.SHS_VER }}
          cache-to: type=gha,mode=max,scope=suse-shs-${{ env.SHS_VER }}

      - name: Build and push runtime image (openSUSE)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/slingshot-runtime:${{ env.SHS_VER }}-suse
          build-args: SHS_VER=${{ env.SHS_VER }}
          cache-from: type=gha,scope=shs-${{ env.SHS_VER }}

      - name: Build and push runtime-dev image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime-dev
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/slingshot-runtime-devel:${{ env.SHS_VER }}-suse
          build-args: SHS_VER=${{ env.SHS_VER }}
          cache-from: type=gha,scope=shs-${{ env.SHS_VER }}

      - name: Build and push ops image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ops
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/slingshot-ops:${{ env.SHS_VER }}-suse
          build-args: SHS_VER=${{ env.SHS_VER }}
          cache-from: type=gha,scope=suse-shs-${{ env.SHS_VER }}

  build-rocky:
    runs-on: ubuntu-latest
    # Rocky only supports SHS 14.0.1
    if: inputs.shs_ver == '14.0.1' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push RPMs image (Rocky)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rocky
          target: rpms
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/slingshot-rpms:14.0.1-rocky
          build-args: |
            SHS_VER=14.0.1
          cache-from: type=gha,scope=rocky-shs-14.0.1
          cache-to: type=gha,mode=max,scope=rocky-shs-14.0.1

      - name: Build and push runtime image (Rocky)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.rocky
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository_owner }}/slingshot-container-runtime:14.0.1-rocky
          build-args: |
            SHS_VER=14.0.1
          cache-from: type=gha,scope=rocky-shs-14.0.1
