name: Build and Push Containers

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      shs_ver:
        description: 'SHS version to build'
        default: '14.0.1'
        type: choice
        options:
          - '14.0.1'
          - '14.0.0'
          - '13.1.0'
          - '13.0.0'
          - '12.0.1'

env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [suse, rocky]
    # Rocky only supports SHS 14.0.1; skip it for any other dispatched version
    # (on push there is no input, so inputs.shs_ver is empty and rocky runs).
    if: ${{ matrix.distro != 'rocky' || inputs.shs_ver == '' || inputs.shs_ver == '14.0.1' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve build context
        id: ctx
        run: |
          echo "shs_ver=${{ inputs.shs_ver || '14.0.1' }}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build RPMs + push container images (${{ matrix.distro }})
        uses: docker/bake-action@v6
        env:
          SHS_VER: ${{ steps.ctx.outputs.shs_ver }}
          DISTROS: ${{ matrix.distro }}
          PUSH: "true"
          REGISTRY_AND_PROJECT: ${{ env.REGISTRY }}/${{ steps.ctx.outputs.owner }}/
        with:
          files: docker-bake.hcl
          targets: |
            shs
            middleware
            containers
          set: |
            *.cache-from=type=gha,scope=${{ matrix.distro }}-${{ steps.ctx.outputs.shs_ver }}
            *.cache-to=type=gha,mode=max,scope=${{ matrix.distro }}-${{ steps.ctx.outputs.shs_ver }}

      - name: Upload RPM artifacts (${{ matrix.distro }})
        uses: actions/upload-artifact@v4
        with:
          name: rpms-${{ matrix.distro }}-${{ steps.ctx.outputs.shs_ver }}
          path: |
            RPMS.${{ matrix.distro }}.${{ steps.ctx.outputs.shs_ver }}/
            RPMS.${{ matrix.distro }}.middleware.${{ steps.ctx.outputs.shs_ver }}/
          if-no-files-found: error
